# Open Build Service workflows for linscp (home:ercorreia/linscp, whose
# _service is port/packaging/obs/_service).
#
# The webhook: GitHub Settings > Webhooks, payload URL
# https://build.opensuse.org/trigger/workflow?id=<workflow token id>, content
# type application/json, the token's secret, events "Pull requests" and
# "Pushes".
#
# Releases are not rebuilt from here. A tag push drafts the GitHub release,
# and a draft's tarball cannot be downloaded yet, so download_files would
# fail. The release workflow reruns the package's services when the release
# is published, with an OBS runservice token. By hand:
#   osc service remoterun home:ercorreia linscp

# Pull requests: OBS branches the package into home:ercorreia:linscp:CI,
# where obs_scm takes the pull request's spec (its commit, from the
# webhook). The spec builds against the published tarball of its Version, so
# a pull request that changes the packaging is built on every target, and the
# result is reported back as a commit status.
packaging_ci:
  steps:
    - branch_package:
        source_project: home:ercorreia
        source_package: linscp
        target_project: home:ercorreia:linscp:CI
  filters:
    event: pull_request
