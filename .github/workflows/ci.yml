# Builds and tests both targets on every pull request: Linux native, and
# Windows cross-compiled with the tests run under Wine. Debian trixie, as the
# toolchain the port is developed with (clang 19, lld, mingw-w64, Wine 10).
#
# The Windows build uses llvm-mingw, fetched pinned (ADR 0011), as does
# census_ratchet in both jobs; binutils' objcopy weakens COFF symbols for it. The tests run as an unprivileged user: sshd and the
# other fixtures are started unprivileged on loopback, as on a developer's
# machine.
name: ci

on:
  pull_request:
  workflow_dispatch:
  # The release workflow (release.yml) runs the whole suite and the packages
  # on the tag before it drafts a release from their artifacts.
  workflow_call:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            configure: -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
            # The .NET SDK's runtime dependency.
            packages: libicu76
          # The optimized configuration the packages are built with: tests
          # that only fail once the optimizer runs show up here.
          - name: linux-release
            configure: >-
              -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
              -DCMAKE_BUILD_TYPE=Release -DLINSCP_RELEASE=ON
            packages: libicu76
          - name: windows-cross
            configure: -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-llvm-mingw.cmake
            packages: wine wine64 zstd
    steps:
      - name: Install the toolchain and the test servers
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git clang lld llvm cmake ninja-build make perl python3 \
            cpio curl unzip xz-utils libssl-dev zlib1g-dev shared-mime-info appstream desktop-file-utils \
            binutils-mingw-w64-x86-64 \
            openssh-client openssh-server rclone microsocks tinyproxy \
            python3-boto3 python3-flask-cors python3-moto python3-openssl \
            python3-pyftpdlib qt6-base-dev qt6-svg-dev qt6-l10n-tools qt6-translations-l10n \
            ${{ matrix.packages }}

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # llvm-mingw and MSYS2's Qt, as their pins name them (ADR 0011). Both
      # jobs need llvm-mingw: census_ratchet compiles core with it.
      - name: Restore llvm-mingw
        uses: actions/cache@v4
        with:
          path: build/tools/llvm-mingw-*
          key: llvm-mingw-${{ hashFiles('port/tools/fetch_llvm_mingw.py') }}
      - name: Restore MSYS2's Qt
        if: matrix.name == 'windows-cross'
        uses: actions/cache@v4
        with:
          path: build/tools/msys2-qt
          key: msys2-qt-${{ hashFiles('port/qt/msys2-qt.lock', 'port/tools/fetch_msys2_qt.py') }}

      - name: Hand the tree to the test user
        run: |
          useradd --create-home ci
          chown -R ci:ci "$GITHUB_WORKSPACE"

      - name: Fetch llvm-mingw
        run: runuser -u ci -- python3 port/tools/fetch_llvm_mingw.py --dest build/tools

      - name: Fetch MSYS2's Qt
        if: matrix.name == 'windows-cross'
        run: runuser -u ci -- python3 port/tools/fetch_msys2_qt.py --dest build/tools/msys2-qt

      - name: Configure
        run: runuser -u ci -- cmake -S . -B build -G Ninja ${{ matrix.configure }}

      - name: Fetch the golden corpus' rclone
        run: >-
          runuser -u ci -- python3 port/tools/fetch_rclone.py
          --corpus port/tests/golden/expected --dest build/tools

      # The SDK ctest dotnet builds and runs WinSCP's assembly with; the
      # native build only, as the SDK does not run under Wine.
      - name: Fetch the .NET SDK
        if: startsWith(matrix.name, 'linux')
        run: runuser -u ci -- python3 port/tools/fetch_dotnet.py --dest build/tools/dotnet

      # FileZilla's sockets and timers need windows, which Wine creates
      # only with a display driver; the null driver needs no display.
      - name: Prepare Wine
        if: matrix.name == 'windows-cross'
        run: >-
          runuser -u ci -- env WINEDEBUG=-all
          wine reg add 'HKCU\Software\Wine\Drivers' /v Graphics /d null /f

      - name: Build
        run: runuser -u ci -- cmake --build build

      - name: Test
        run: runuser -u ci -- ctest --test-dir build --output-on-failure --timeout 1800

      - name: Keep the test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testlogs-${{ matrix.name }}
          path: build/Testing/Temporary/
          if-no-files-found: ignore

  # The packages, from a release build (LINSCP_RELEASE: no "Dev Build"
  # marking): the .deb and the AppImage, for the distribution built on; the
  # Windows installer, compiled by the pinned Inno Setup under Wine.
  packages:
    name: packages-${{ matrix.name }}
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 120
    # The container's HOME is not root's own, where Wine refuses its prefix.
    env:
      WINEPREFIX: /root/wine
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            configure: -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
            targets: package-deb package-appimage
            packages: dpkg-dev file qt6-svg-plugins
            artifacts: |
              build/packages/*.deb
              build/packages/*.AppImage
          - name: windows
            configure: -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-llvm-mingw.cmake
            targets: installer package-portable
            # Inno Setup 6's compiler is 32-bit.
            architecture: i386
            packages: wine wine64 wine32:i386 zstd
            artifacts: |
              build/packages/*-setup.exe
              build/packages/*-portable.zip
    steps:
      - name: Install the toolchain
        run: |
          if [ -n "${{ matrix.architecture }}" ]; then dpkg --add-architecture ${{ matrix.architecture }}; fi
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git clang lld llvm cmake ninja-build make perl python3 \
            cpio curl unzip xz-utils libssl-dev zlib1g-dev \
            binutils-mingw-w64-x86-64 \
            qt6-base-dev qt6-svg-dev qt6-wayland qt6-l10n-tools qt6-translations-l10n \
            ${{ matrix.packages }}

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore llvm-mingw
        uses: actions/cache@v4
        with:
          path: build/tools/llvm-mingw-*
          key: llvm-mingw-${{ hashFiles('port/tools/fetch_llvm_mingw.py') }}
      - name: Restore MSYS2's Qt
        if: matrix.name == 'windows'
        uses: actions/cache@v4
        with:
          path: build/tools/msys2-qt
          key: msys2-qt-${{ hashFiles('port/qt/msys2-qt.lock', 'port/tools/fetch_msys2_qt.py') }}

      - name: Fetch llvm-mingw
        run: python3 port/tools/fetch_llvm_mingw.py --dest build/tools

      - name: Fetch MSYS2's Qt
        if: matrix.name == 'windows'
        run: python3 port/tools/fetch_msys2_qt.py --dest build/tools/msys2-qt

      # The SDK that builds WinSCP's .NET assembly into the packages' dotnet
      # folder, for WinSCP's PowerShell extensions (both platforms now).
      - name: Fetch the .NET SDK
        run: python3 port/tools/fetch_dotnet.py --dest build/tools/dotnet

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLINSCP_RELEASE=ON
          -DBUILD_TESTING=OFF ${{ matrix.configure }}

      # The Inno Setup installers make windows even when silent; the null
      # display driver needs no display.
      - name: Prepare Wine
        if: matrix.name == 'windows'
        run: wine reg add 'HKCU\Software\Wine\Drivers' /v Graphics /d null /f
        env:
          WINEDEBUG: -all

      - name: Build the packages
        run: cmake --build build --target ${{ matrix.targets }}
        env:
          WINEDEBUG: -all

      - uses: actions/upload-artifact@v4
        with:
          name: linscp-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  # The tests against real servers (P3-18: port/tests/servers/), which start
  # containers: the build container runs on the runner's network with its
  # docker socket, and a temporary directory at the same path on both sides
  # (port/tools/ci_real_servers.sh).
  real-servers:
    name: real-servers
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build and test against the real servers
        run: |
          mkdir -p /tmp/linscp-shared
          docker run --rm --network host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /tmp/linscp-shared:/tmp/linscp-shared -e TMPDIR=/tmp/linscp-shared \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
            debian:trixie bash port/tools/ci_real_servers.sh

  # A rolling toolchain (Arch: the newest clang and libstdc++), so what a newer
  # compiler or <new> assumes about operator new shows up here first, before a
  # distribution's packager meets it. Not blocking: rolling breakage does not
  # hold up pull requests.
  linux-rolling:
    name: linux-rolling
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - name: Install the toolchain
        run: >-
          pacman -Syu --noconfirm --needed git clang lld llvm cmake ninja python
          qt6-base qt6-svg qt6-tools qt6-declarative openssl expat
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Hand the tree to the test user
        run: |
          useradd --create-home ci
          chown -R ci:ci "$GITHUB_WORKSPACE"
      - name: Configure
        run: >-
          runuser -u ci -- cmake -S . -B build -G Ninja
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=Release
          -DLINSCP_SYSTEM_OPENSSL=ON -DLINSCP_SYSTEM_EXPAT=ON
      - name: Build
        run: runuser -u ci -- cmake --build build
      # census_ratchet needs the pinned llvm-mingw; the fixture servers are
      # Debian's job.
      - name: Test
        run: >-
          runuser -u ci -- ctest --test-dir build --output-on-failure
          -LE real-servers -E '^census_ratchet$'

  # The Flatpak, in Flathub's builder image (flatpak-builder needs the
  # privileges to sandbox its builds).
  flatpak:
    name: packages-flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build the bundle
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          python3 port/tools/build_flatpak.py --out build/packages --builder-arg=--disable-rofiles-fuse

      # Flathub's linter on the manifest and the build, with the findings
      # port/packaging/flatpak/lint-exceptions.json explains. The builder
      # image has it installed (not sandboxed: org.flatpak.Builder's sandbox
      # cannot write its state directory in the container's checkout).
      - name: Lint the Flatpak
        run: |
          lint() {
            flatpak-builder-lint --exceptions --user-exceptions port/packaging/flatpak/lint-exceptions.json "$@"
          }
          lint manifest port/packaging/flatpak/org.linscp.linscp.yml
          lint repo build/flatpak/repo

      - uses: actions/upload-artifact@v4
        with:
          name: linscp-flatpak
          path: build/packages/*.flatpak
          if-no-files-found: error
