# Builds and tests both targets on every pull request: Linux native, and
# Windows cross-compiled with the tests run under Wine. Debian trixie, as the
# toolchain the port is developed with (clang 19, lld, mingw-w64, Wine 10).
#
# The tests run as an unprivileged user: sshd and the other fixtures are
# started unprivileged on loopback, as on a developer's machine.
name: ci

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            configure: -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
            packages: ''
          - name: windows-cross
            configure: -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-mingw-w64.cmake
            packages: >-
              binutils-mingw-w64-x86-64 g++-mingw-w64-x86-64-posix
              gcc-mingw-w64-x86-64-posix mingw-w64-x86-64-dev libz-mingw-w64
              wine wine64
    steps:
      - name: Install the toolchain and the test servers
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git clang lld llvm cmake ninja-build make perl python3 \
            cpio curl unzip libssl-dev zlib1g-dev \
            openssh-client openssh-server rclone microsocks tinyproxy \
            python3-boto3 python3-flask-cors python3-moto python3-pyftpdlib \
            ${{ matrix.packages }}

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Hand the tree to the test user
        run: |
          useradd --create-home ci
          chown -R ci:ci "$GITHUB_WORKSPACE"

      - name: Configure
        run: runuser -u ci -- cmake -S . -B build -G Ninja ${{ matrix.configure }}

      - name: Fetch the golden corpus' rclone
        run: >-
          runuser -u ci -- python3 port/tools/fetch_rclone.py
          --corpus port/tests/golden/expected --dest build/tools

      - name: Build
        run: runuser -u ci -- cmake --build build

      - name: Test
        run: runuser -u ci -- ctest --test-dir build --output-on-failure --timeout 1800

      - name: Keep the test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testlogs-${{ matrix.name }}
          path: build/Testing/Temporary/
          if-no-files-found: ignore
