# Builds and tests both targets on every pull request: Linux native, and
# Windows cross-compiled with the tests run under Wine. Debian trixie, as the
# toolchain the port is developed with (clang 19, lld, mingw-w64, Wine 10).
#
# The Windows build uses llvm-mingw, fetched pinned (ADR 0011), as does
# census_ratchet in both jobs; binutils' objcopy weakens COFF symbols for it. The tests run as an unprivileged user: sshd and the
# other fixtures are started unprivileged on loopback, as on a developer's
# machine.
name: ci

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            configure: -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
            # The .NET SDK's runtime dependency.
            packages: libicu76
          - name: windows-cross
            configure: -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-llvm-mingw.cmake
            packages: wine wine64 zstd
    steps:
      - name: Install the toolchain and the test servers
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git clang lld llvm cmake ninja-build make perl python3 \
            cpio curl unzip xz-utils libssl-dev zlib1g-dev shared-mime-info \
            binutils-mingw-w64-x86-64 \
            openssh-client openssh-server rclone microsocks tinyproxy \
            python3-boto3 python3-flask-cors python3-moto python3-openssl \
            python3-pyftpdlib qt6-base-dev qt6-svg-dev qt6-l10n-tools qt6-translations-l10n \
            ${{ matrix.packages }}

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # llvm-mingw and MSYS2's Qt, as their pins name them (ADR 0011). Both
      # jobs need llvm-mingw: census_ratchet compiles core with it.
      - name: Restore llvm-mingw
        uses: actions/cache@v4
        with:
          path: build/tools/llvm-mingw-*
          key: llvm-mingw-${{ hashFiles('port/tools/fetch_llvm_mingw.py') }}
      - name: Restore MSYS2's Qt
        if: matrix.name == 'windows-cross'
        uses: actions/cache@v4
        with:
          path: build/tools/msys2-qt
          key: msys2-qt-${{ hashFiles('port/qt/msys2-qt.lock') }}

      - name: Hand the tree to the test user
        run: |
          useradd --create-home ci
          chown -R ci:ci "$GITHUB_WORKSPACE"

      - name: Fetch llvm-mingw
        run: runuser -u ci -- python3 port/tools/fetch_llvm_mingw.py --dest build/tools

      - name: Fetch MSYS2's Qt
        if: matrix.name == 'windows-cross'
        run: runuser -u ci -- python3 port/tools/fetch_msys2_qt.py --dest build/tools/msys2-qt

      - name: Configure
        run: runuser -u ci -- cmake -S . -B build -G Ninja ${{ matrix.configure }}

      - name: Fetch the golden corpus' rclone
        run: >-
          runuser -u ci -- python3 port/tools/fetch_rclone.py
          --corpus port/tests/golden/expected --dest build/tools

      # The SDK ctest dotnet builds and runs WinSCP's assembly with; the
      # native build only, as the SDK does not run under Wine.
      - name: Fetch the .NET SDK
        if: matrix.name == 'linux'
        run: runuser -u ci -- python3 port/tools/fetch_dotnet.py --dest build/tools/dotnet

      # FileZilla's sockets and timers need windows, which Wine creates
      # only with a display driver; the null driver needs no display.
      - name: Prepare Wine
        if: matrix.name == 'windows-cross'
        run: >-
          runuser -u ci -- env WINEDEBUG=-all
          wine reg add 'HKCU\Software\Wine\Drivers' /v Graphics /d null /f

      - name: Build
        run: runuser -u ci -- cmake --build build

      - name: Test
        run: runuser -u ci -- ctest --test-dir build --output-on-failure --timeout 1800

      - name: Keep the test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testlogs-${{ matrix.name }}
          path: build/Testing/Temporary/
          if-no-files-found: ignore

  # The packages, from a release build (LINSCP_RELEASE: no "Dev Build"
  # marking): the .deb and the AppImage, for the distribution built on; the
  # Windows installer, compiled by the pinned Inno Setup under Wine.
  packages:
    name: packages-${{ matrix.name }}
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            configure: -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
            targets: package-deb package-appimage
            packages: dpkg-dev file qt6-svg-plugins
            artifacts: |
              build/packages/*.deb
              build/packages/*.AppImage
          - name: windows
            configure: -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-llvm-mingw.cmake
            targets: installer
            packages: wine wine64 zstd
            artifacts: build/packages/*-setup.exe
    steps:
      - name: Install the toolchain
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git clang lld llvm cmake ninja-build make perl python3 \
            cpio curl unzip xz-utils libssl-dev zlib1g-dev \
            binutils-mingw-w64-x86-64 \
            qt6-base-dev qt6-svg-dev qt6-wayland qt6-l10n-tools qt6-translations-l10n \
            ${{ matrix.packages }}

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore llvm-mingw
        uses: actions/cache@v4
        with:
          path: build/tools/llvm-mingw-*
          key: llvm-mingw-${{ hashFiles('port/tools/fetch_llvm_mingw.py') }}
      - name: Restore MSYS2's Qt
        if: matrix.name == 'windows'
        uses: actions/cache@v4
        with:
          path: build/tools/msys2-qt
          key: msys2-qt-${{ hashFiles('port/qt/msys2-qt.lock') }}

      - name: Fetch llvm-mingw
        run: python3 port/tools/fetch_llvm_mingw.py --dest build/tools

      - name: Fetch MSYS2's Qt
        if: matrix.name == 'windows'
        run: python3 port/tools/fetch_msys2_qt.py --dest build/tools/msys2-qt

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLINSCP_RELEASE=ON
          -DBUILD_TESTING=OFF ${{ matrix.configure }}

      # The Inno Setup installers make windows even when silent; the null
      # display driver needs no display.
      - name: Prepare Wine
        if: matrix.name == 'windows'
        run: wine reg add 'HKCU\Software\Wine\Drivers' /v Graphics /d null /f
        env:
          WINEDEBUG: -all

      - name: Build the packages
        run: cmake --build build --target ${{ matrix.targets }}
        env:
          WINEDEBUG: -all

      - uses: actions/upload-artifact@v4
        with:
          name: linscp-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  # The Flatpak, in Flathub's builder image (flatpak-builder needs the
  # privileges to sandbox its builds).
  flatpak:
    name: packages-flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build the bundle
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          python3 port/tools/build_flatpak.py --out build/packages

      - uses: actions/upload-artifact@v4
        with:
          name: linscp-flatpak
          path: build/packages/*.flatpak
          if-no-files-found: error
