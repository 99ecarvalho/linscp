# Drafts a GitHub release when a version tag is pushed:
#
#   git tag -s v0.7.2 -m "linscp 0.7.2"    # annotated and signed
#   git push origin v0.7.2
#
# It runs the whole CI (tests and packages) on the tag, checks that the tag
# matches the version in CMakeLists.txt, that NEWS.md has a section for it and
# the metainfo a release entry (with its notes),
# builds the complete source tarball (port/tools/make_source_tarball.py) and
# the third-party sources tar (the copyleft components the packages ship, as
# their SOURCE-OFFER.txt says; port/tools/fetch_sources.py), and drafts the
# release with the packages, the tarballs, SHA256SUMS and, when the
# signing key is configured, OpenPGP signatures. The draft is reviewed and
# published by hand; publishing it tells the website to rebuild (website job).
#
# Secrets (both optional):
#   RELEASE_SIGNING_KEY         ASCII-armoured OpenPGP secret key of a signing
#                               subkey (and RELEASE_SIGNING_PASSPHRASE if it has
#                               one). Without it the draft carries no .asc files;
#                               sign locally and upload them before publishing.
#   WEBSITE_DISPATCH_TOKEN      A token allowed to send repository_dispatch to
#                               99ecarvalho/linscp-website.
name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  release:
    types: [published]
  # By hand: publish the latest release to the package channels again (a
  # channel set up after the release, or a failed upload).
  workflow_dispatch:
    inputs:
      chocolatey_repush:
        description: Push the Chocolatey package again at the same version (allowed until moderators approve it)
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  draft:
    if: github.event_name == 'push'
    needs: ci
    # The runner image has git, gpg, gh, python3 and xz.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
      SIGNING_PASSPHRASE: ${{ secrets.RELEASE_SIGNING_PASSPHRASE }}
    steps:
      # Full history and tags: the tag object is checked, and the tarball's
      # timestamps come from the tagged commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Check the tag, the version and the news
        run: |
          version=$(sed -n 's/^project(linscp VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          case "$TAG" in
            "v$version"|"v$version"-*) ;;
            *) echo "::error::tag $TAG does not match the version $version in CMakeLists.txt"; exit 1 ;;
          esac
          if [ "$(git cat-file -t "refs/tags/$TAG")" != tag ]; then
            echo "::error::$TAG is a lightweight tag: tag releases with git tag -s"; exit 1
          fi
          # The section of NEWS.md headed "## <version>", up to the next "## ".
          awk -v v="$version" '
            $0 ~ "^## " v "( |$)" { on = 1; next }
            on && /^## / { exit }
            on { print }' NEWS.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::NEWS.md has no section for $version"; exit 1
          fi
          # Software centres show the metainfo's release notes.
          if ! grep -q "<release version=\"$version\" date=" port/packaging/linux/org.linscp.linscp.metainfo.xml; then
            echo "::error::the metainfo (port/packaging/linux) has no release entry for $version"; exit 1
          fi
          # The distribution recipes build the tagged tree's tarball.
          spec=$(sed -n 's/^Version:[[:space:]]*//p' port/packaging/rpm/linscp.spec)
          if [ "$spec" != "$version" ]; then
            echo "::error::port/packaging/rpm/linscp.spec has Version $spec, not $version"; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build the source tarball
        run: python3 port/tools/make_source_tarball.py --out dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: linscp-*
          path: dist
          merge-multiple: true

      # The source code of the copyleft third-party components the AppImage
      # and the Windows build ship, which their SOURCE-OFFER.txt points to.
      - name: Collect the third-party sources
        run: |
          work=$(mktemp -d)
          # Artifacts lose the executable bit on their way between jobs.
          chmod +x "dist/linscp-$VERSION-x86_64.AppImage"
          (cd "$work" && "$GITHUB_WORKSPACE/dist/linscp-$VERSION-x86_64.AppImage" \
             --appimage-extract usr/share/licenses/linscp/third-party.json >/dev/null)
          unzip -q -j -d "$work/windows" "dist/linscp-$VERSION-portable.zip" \
            "linscp-$VERSION/licenses/third-party.json"
          python3 port/tools/fetch_sources.py --out "$work/sources" \
            --from "$work/squashfs-root/usr/share/licenses/linscp/third-party.json" \
            --from "$work/windows/third-party.json"
          tar -C "$work" --sort=name --owner=0 --group=0 --numeric-owner \
            -cf "dist/linscp-$VERSION-third-party-sources.tar" \
            --transform "s|^sources|linscp-$VERSION-third-party-sources|" sources
          rm -rf "$work"

      - name: Checksums and signatures
        run: |
          cd dist
          rm -f ./*.sha256
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          if [ -n "$SIGNING_KEY" ]; then
            export GNUPGHOME="$(mktemp -d)"
            printf '%s\n' "$SIGNING_KEY" | gpg --batch --import
            sign() { gpg --batch --yes --pinentry-mode loopback --passphrase "$SIGNING_PASSPHRASE" \
                       --armor --detach-sign "$1"; }
            sign SHA256SUMS
            sign "linscp-$VERSION.tar.xz"
            gpgconf --kill all
            rm -rf "$GNUPGHOME"
          else
            echo "::warning::RELEASE_SIGNING_KEY is not set: sign SHA256SUMS and the tarball locally"
          fi

      - name: Draft the release
        run: |
          prerelease=
          case "$TAG" in *-*) prerelease=--prerelease ;; esac
          gh release create "$TAG" --draft --verify-tag $prerelease \
            --title "linscp $VERSION" --notes-file notes.md dist/*

  # Publishing the reviewed draft: the website rebuilds its download page and
  # release data now instead of at its daily run.
  website:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    env:
      WEBSITE_DISPATCH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
    steps:
      - name: Tell the website
        if: env.WEBSITE_DISPATCH_TOKEN != ''
        run: >-
          curl -fsS -X POST
          -H "Authorization: Bearer $WEBSITE_DISPATCH_TOKEN"
          -H "Accept: application/vnd.github+json"
          https://api.github.com/repos/99ecarvalho/linscp-website/dispatches
          -d '{"event_type":"linscp-release"}'

  # The package channels, once a release is published (or by hand). Each job
  # skips itself while its secret is not set; the jobs still waiting for an
  # account are in port/packaging/ci/release-jobs.yml.

  # Chocolatey (community.chocolatey.org, owner ercorreia): packs
  # port/packaging/chocolatey for the latest release and pushes it, unless
  # that version is already there. New versions go through Chocolatey's
  # moderation before they are listed.
  #   CHOCOLATEY_API_KEY   the account's API key
  chocolatey:
    if: (github.event_name == 'release' && !github.event.release.prerelease) || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest   # has choco
    timeout-minutes: 20
    env:
      CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      REPUSH: ${{ inputs.chocolatey_repush }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.CHOCOLATEY_API_KEY != ''
        with:
          sparse-checkout: port/packaging/chocolatey
      - name: Pack and push the package
        if: env.CHOCOLATEY_API_KEY != ''
        shell: pwsh
        working-directory: port/packaging/chocolatey
        run: |
          $latest = (gh release view -R $env:GITHUB_REPOSITORY --json tagName --jq .tagName) -replace '^v', ''
          [xml]$nuspec = Get-Content linscp.nuspec
          $version = $nuspec.package.metadata.version
          if ($version -ne $latest) {
            # Behind the release: chocolatey-au moves the nuspec and the
            # install script to it (checksum from SHA256SUMS) and packs.
            Install-Module Chocolatey-AU -RequiredVersion 1.0.0 -Force -Scope CurrentUser
            ./update.ps1
            $version = $latest
          } else {
            choco pack linscp.nuspec
          }
          $package = Get-ChildItem "linscp.$version.nupkg" -ErrorAction SilentlyContinue
          if (-not $package) { throw "no linscp.$version.nupkg was made" }
          # A version already pushed (even if still in moderation) is not pushed again.
          $listed = Invoke-WebRequest -SkipHttpErrorCheck -Uri "https://community.chocolatey.org/api/v2/Packages(Id='linscp',Version='$version')"
          if (($listed.StatusCode -eq 200) -and ($env:REPUSH -ne 'true')) {
            Write-Output "linscp $version is already on Chocolatey"
          } else {
            choco push $package.FullName --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY
          }

  # openSUSE OBS (home:ercorreia/linscp): reruns the package's services
  # (port/packaging/obs/_service: the packaging files from the repository and
  # the published tarball), which rebuilds every target. Pull requests build
  # there through .obs/workflows.yml.
  #   OBS_RUNSERVICE_TOKEN   osc token --create --operation runservice home:ercorreia linscp
  obs:
    if: (github.event_name == 'release' && !github.event.release.prerelease) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      OBS_RUNSERVICE_TOKEN: ${{ secrets.OBS_RUNSERVICE_TOKEN }}
    steps:
      - name: Rerun the OBS package's services
        if: env.OBS_RUNSERVICE_TOKEN != ''
        run: >-
          curl -fsS -X POST
          -H "Authorization: Token $OBS_RUNSERVICE_TOKEN"
          "https://api.opensuse.org/trigger/runservice?project=home:ercorreia&package=linscp"
