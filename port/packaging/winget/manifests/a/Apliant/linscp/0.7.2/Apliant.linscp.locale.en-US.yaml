ShortDescription: Transfer files to and from servers over SFTP, SCP, FTP/FTPS, WebDAV and S3.
Description: |-
  linscp transfers files between your computer and remote servers over SFTP, SCP, FTP (with TLS), WebDAV and S3. Its two-panel interface shows local and remote files side by side, with the same sessions, settings and scripting on Linux and Windows.
  It synchronizes and compares directories, keeps a remote directory up to date, edits remote files, and runs commands on the server. linscp-cli runs the same transfers from scripts.
